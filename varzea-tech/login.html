<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Várzea Tech - Login</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#030d09" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f1f7f3" media="(prefers-color-scheme: light)">
  <script>try{var t=localStorage.getItem("vt_tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<main class="wrap">
  <form class="panel narrow" id="formLogin">
    <div class="brand-logo" role="img" aria-label="Várzea Tech"></div>
    <h2>Bem-vindo ao Várzea Tech</h2>
    <p class="sub">Entre para confirmar presença nos rachas e organizar os seus.</p>
    <label>E-mail, telefone ou usuário*<input name="id" required autocomplete="username"></label>
    <label>Senha*
      <span class="pw"><input type="password" name="senha" required autocomplete="current-password"><button type="button" class="eye" aria-label="Mostrar ou ocultar senha"></button></span>
    </label>
    <p class="forgot"><a class="link" href="esqueci.html">Esqueceu a senha?</a></p>
    <div class="actions">
      <a href="cadastro.html" class="btn btn-line">Criar conta</a>
      <button class="btn btn-solid">Entrar</button>
    </div>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>
