# Configuração para guardar os dados num ficheiro físico (pasta 'banco_de_dados')
spring.datasource.url=jdbc:h2:file:./banco_de_dados/varzea_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Diz ao Hibernate para apenas ATUALIZAR as tabelas (sem apagar os dados)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Habilita a consola do H2 (pode aceder em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console