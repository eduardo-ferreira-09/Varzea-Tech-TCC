# ===============================
# CONFIGURAÇÃO DO MYSQL
# ===============================
# O parâmetro createDatabaseIfNotExist=true resolve o erro "Unknown database"
spring.datasource.url=jdbc:mysql://localhost:3306/varzea_db?serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true
spring.datasource.username=root
# ATENÇÃO: Substitua 'sua_senha_aqui' pela senha real do seu MySQL Workbench!
spring.datasource.password=senaisp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURAÇÃO DO HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# ===============================
# IGNORAR DOCKER COMPOSE
# ===============================
spring.docker.compose.enabled=false